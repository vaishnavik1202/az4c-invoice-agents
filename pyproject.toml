[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "az4c-invoice-agents"
version = "0.1.0"
description = "Multi-agent invoice exception desk (AZ4C assignment, use case 1)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "tenacity>=8.2",
]

[tool.setuptools.packages.find]
where = ["src"]
